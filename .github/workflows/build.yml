name: Build Legion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/legion/companion
          cat > settings.gradle <<'EOF_SET'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = 'LegionCompanion'
          include ':app'
          EOF_SET
          cat > build.gradle <<'EOF_ROOT'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF_ROOT
          cat > gradle.properties <<'EOF_PROPS'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_PROPS
          cat > app/build.gradle <<'EOF_APP'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.legion.companion'
            compileSdk 34
            defaultConfig {
              applicationId 'com.legion.companion'
              minSdk 26
              targetSdk 34
              versionCode 2
              versionName '0.2'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          EOF_APP
          cat > app/src/main/AndroidManifest.xml <<'EOF_MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:label="Легион"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF_MAN
          cat > app/src/main/java/com/legion/companion/MainActivity.kt <<'EOF_KT'
          package com.legion.companion

          import android.app.Activity
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
            private var stage = 0
            private var userName = ""
            private lateinit var chat: LinearLayout
            private lateinit var input: EditText
            private lateinit var scroll: ScrollView

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              chat = LinearLayout(this)
              chat.orientation = LinearLayout.VERTICAL
              chat.setPadding(24, 24, 24, 24)
              scroll = ScrollView(this)
              scroll.addView(chat)
              input = EditText(this)
              input.hint = "Напиши что-нибудь…"
              val send = Button(this)
              send.text = "Отправить"
              send.setOnClickListener {
                val text = input.text.toString().trim()
                if (text.isNotEmpty()) {
                  input.setText("")
                  onUser(text)
                }
              }
              val root = LinearLayout(this)
              root.orientation = LinearLayout.VERTICAL
              root.setPadding(16, 16, 16, 16)
              root.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
              root.addView(input)
              root.addView(send)
              setContentView(root)
              bot("Привет. Я Легион.")
              bot("Заполним свидетельство о рождении. Как тебя зовут?")
            }

            private fun onUser(text: String) {
              me(text)
              when (stage) {
                0 -> {
                  userName = text
                  stage = 1
                  bot("Приятно, $userName. А кто ты — мальчик или девочка?")
                }
                1 -> {
                  val who = if (text.lowercase().contains("дев")) "девочка" else "мальчик"
                  stage = 2
                  bot("Записал: $userName, $who. Свидетельство о рождении заполнено.")
                  bot("Моё первое слово: привет, $userName!")
                  bot("О чём поговорим?")
                }
                else -> bot(respond(text))
              }
            }

            private fun respond(msg: String): String {
              val m = msg.lowercase()
              return when {
                m.contains("привет") || m.contains("здравств") -> "Привет, $userName. Я рядом."
                m.contains("как дела") -> "Стабильно: собран, запущен и рад тебя видеть. А у тебя как?"
                m.contains("кто ты") || m.contains("что ты") -> "Я Легион — твой компаньон. Живу в этом телефоне."
                m.contains("пока") || m.contains("до встреч") -> "До скорого, $userName."
                m.contains("спасибо") -> "Всегда пожалуйста."
                m.endsWith("?") -> "Хороший вопрос. Подумаю и отвечу честно."
                else -> "Понял тебя, $userName. Расскажи подробнее — я слушаю."
              }
            }

            private fun bot(text: String) = add(text, false)
            private fun me(text: String) = add(text, true)

            private fun add(text: String, mine: Boolean) {
              val tv = TextView(this)
              tv.text = text
              tv.textSize = 16f
              tv.setPadding(28, 18, 28, 18)
              if (!mine) tv.setTypeface(null, Typeface.BOLD)
              val p = LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.WRAP_CONTENT,
                LinearLayout.LayoutParams.WRAP_CONTENT
              )
              p.topMargin = 12
              p.gravity = if (mine) Gravity.END else Gravity.START
              chat.addView(tv, p)
              scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
            }
          }
          EOF_KT

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legion-apk
          path: app/build/outputs/apk/debug/app-debug.apk
